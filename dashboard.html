<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Dashboard | Scholarship Finder</title><link rel="icon" href="images/favicon.png" type="image/png"><link rel="stylesheet" href="css/style.css"></head>
<body><header class="simple-header">
  <nav class="nav">

    <div class="nav-actions">

      <div id="accountActions" class="account-actions"></div>
